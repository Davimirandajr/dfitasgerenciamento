<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DFitas - Autenticação</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dfitas: {
              vinho: '#8A102C',
              rosa: '#D94C79',
              bg: '#F8FAFC',
              card: '#FFFFFF',
              border: '#E2E8F0',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-dfitas-bg text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4 select-none">

  <div class="w-full max-w-md bg-white rounded-3xl border border-dfitas-border shadow-2xl p-6 sm:p-8 space-y-6">
    
    <!-- BRANDING -->
    <div class="text-center space-y-2">
      <div class="w-16 h-16 bg-dfitas-vinho rounded-2xl flex items-center justify-center text-white font-bold text-2xl mx-auto shadow-lg shadow-dfitas-vinho/20">
        DF
      </div>
      <h1 class="text-2xl font-bold text-dfitas-vinho">DFitas</h1>
      <p class="text-xs text-slate-500">Digite seu usuário para acessar o painel</p>
    </div>

    <!-- MENSAGEM DE ERRO -->
    <div id="erroLogin" class="hidden bg-rose-50 border border-rose-200 text-rose-600 text-xs p-3.5 rounded-2xl text-center font-medium animate-pulse"></div>

    <!-- FORMULÁRIO -->
    <form id="formLogin" onsubmit="return false;" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Usuário ou E-mail</label>
        <div class="relative">
          <input type="text" id="usuario" required placeholder="Ex: admin ou maria" autocomplete="username" class="w-full p-3.5 pl-10 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-dfitas-vinho lowercase transition-all" />
          <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-4"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Senha</label>
        <div class="relative">
          <input type="password" id="senha" required placeholder="••••••••" autocomplete="current-password" class="w-full p-3.5 pl-10 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-dfitas-vinho transition-all" />
          <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-4"></i>
        </div>
      </div>

      <button type="button" id="btnEntrar" class="w-full py-4 bg-dfitas-vinho active:scale-95 hover:bg-dfitas-vinho/90 text-white font-bold text-sm rounded-xl shadow-lg shadow-dfitas-vinho/30 transition flex items-center justify-center gap-2 touch-manipulation">
        <i data-lucide="log-in" class="w-4 h-4"></i> Entrar no Sistema
      </button>
    </form>

    <div class="text-center pt-1">
      <span class="text-[11px] text-slate-400">DFitas Gerenciamento &copy; 2026</span>
    </div>

  </div>

  <!-- INTEGRANDO SDK FIREBASE AUTH & FIRESTORE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB96jQgvX8nvBKcQGjgIHYzVCUkaFl_n_s",
      authDomain: "dfitas-gerenciamento.firebaseapp.com",
      projectId: "dfitas-gerenciamento",
      storageBucket: "dfitas-gerenciamento.firebasestorage.app",
      messagingSenderId: "699981689369",
      appId: "1:699981689369:web:60348dfa2ec7fffedf3088"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const btnEntrar = document.getElementById('btnEntrar');
    const erroDiv = document.getElementById('erroLogin');

    async function realizarLogin() {
      erroDiv.classList.add('hidden');
      
      const usuarioInput = document.getElementById('usuario').value.trim().toLowerCase();
      const senha = document.getElementById('senha').value;

      if(!usuarioInput || !senha) {
        erroDiv.classList.remove('hidden');
        erroDiv.innerText = "Preencha o usuário e a senha.";
        return;
      }

      btnEntrar.disabled = true;
      btnEntrar.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Entrando...`;
      lucide.createIcons();

      // Mapeia usuário simples para o e-mail cadastrado (ex: dada -> dada@davi.com ou admin -> admin@dfitas.com)
      let emailFinal = usuarioInput;
      if (!usuarioInput.includes('@')) {
        emailFinal = `${usuarioInput}@dfitas.com`;
      }

      try {
        // 1. Autentica no Firebase
        const userCredential = await signInWithEmailAndPassword(auth, emailFinal, senha);
        const user = userCredential.user;

        // 2. Verifica a função (role) do usuário
        let role = 'funcionario';
        try {
          const userDoc = await getDoc(doc(db, "usuarios", user.uid));
          if (userDoc.exists() && userDoc.data().role) {
            role = userDoc.data().role;
          }
        } catch (dbErr) {
          console.warn("Seguindo regra de fallback para cargo.");
        }

        // 3. Redirecionamento de acordo com o papel do usuário
        if (role === 'admin' || usuarioInput.includes('admin') || usuarioInput.includes('gerencia')) {
          window.location.replace('admin.html');
        } else {
          window.location.replace('funcionario.html');
        }

      } catch (error) {
        console.error("Erro no login:", error);
        btnEntrar.disabled = false;
        btnEntrar.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Entrar no Sistema`;
        lucide.createIcons();

        erroDiv.classList.remove('hidden');
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
          erroDiv.innerText = "Usuário ou senha incorretos.";
        } else if (error.code === 'auth/unauthorized-domain') {
          erroDiv.innerText = "Domínio não autorizado no Firebase Console.";
        } else {
          erroDiv.innerText = "Erro ao conectar. Tente novamente.";
        }
      }
    }

    // Ação do Botão e Suporte ao Teclado do Celular (Enter)
    btnEntrar.addEventListener('click', realizarLogin);
    document.getElementById('formLogin').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        realizarLogin();
      }
    });

    lucide.createIcons();
  </script>
</body>
</html>
